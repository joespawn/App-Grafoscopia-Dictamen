<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dictamen Pericial Grafoscopia y Documentoscopia Completo</title>
    <meta name="description" content="Es una aplicación para realizar el dictamen pericial en Grafoscopía y Documentoscopía, y todo lo que se necesita esencialmente" />
    <meta property="og:title" content="Dictamen Pericial Grafoscopia y Documentoscopia Completo" />
    <meta property="og:description" content="Es una aplicación para realizar el dictamen pericial en Grafoscopía y Documentoscopía, y todo lo que se necesita esencialmente" />
    <style>
      /* Prevenir comportamiento de rebote en scroll de móviles */
      body {
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
      }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.5); 
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.8); }
      
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }

      .glass-input {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(4px);
      }
      .glass-input:focus {
        background: rgba(255, 255, 255, 0.8);
        border-color: rgba(99, 102, 241, 0.5);
      }
    </style>
  </head>
  <body class="bg-fixed bg-gradient-to-br from-indigo-200 via-purple-200 to-pink-200 text-slate-800 antialiased h-screen w-screen overflow-hidden">
    <div class="fixed top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-blue-400/20 blur-[100px] pointer-events-none z-[-1]"></div>
    <div class="fixed bottom-[-20%] right-[-10%] w-[50%] h-[50%] rounded-full bg-purple-400/20 blur-[100px] pointer-events-none z-[-1]"></div>
    
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
